name: Test, Build
on:
  push:
    branch:
      - master
  pull_request:
    branch:
      - master
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: install packages
        run: npm ci
      - name: run unit tests
        run: npm test
      - name: build docker image
        run: docker build -t website-retro .
